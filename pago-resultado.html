<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Resultado del pago · CosechaSelecta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFFFFF;--line:#D9E0D5;--ink:#14211A;--muted:#55645B;--forest:#1F4632;--forest-ink:#F4F7F2;--chili:#B8321D;--gold:#C98F12;--gold-soft:#F6EBCF;--display:"Instrument Serif","Iowan Old Style",Georgia,serif;--body:"Manrope","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1612;--surface:#151F19;--line:#2A3A30;--ink:#EEF2EC;--muted:#A3B2A8;--forest:#2E6447;--chili:#E2654D;--gold:#E2AE3E;--gold-soft:#2E2610;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0F1612;--surface:#151F19;--line:#2A3A30;--ink:#EEF2EC;--muted:#A3B2A8;--forest:#2E6447;--chili:#E2654D;--gold:#E2AE3E;--gold-soft:#2E2610;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);min-height:100vh;display:flex;flex-direction:column}
header,main{width:100%;max-width:560px;margin:0 auto;padding:0 16px}header{padding-top:22px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font:400 24px var(--display)}.logo em{color:var(--forest)}.logo img{width:34px;height:34px}.m-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .m-l{display:none}:root:not([data-theme=light]) .m-d{display:block}}
main{padding-block:28px 64px}h1{font:400 clamp(34px,7vw,46px)/1.05 var(--display);margin:0 0 10px}h1 em{color:var(--forest)}.lead{color:var(--muted);margin:0 0 26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}input{font:500 16px var(--body);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}input:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:460px){.row{grid-template-columns:1fr}}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;font:600 16px/1 var(--body);padding:16px 22px;border-radius:999px;border:0;background:var(--forest);color:var(--forest-ink);cursor:pointer;text-decoration:none}.btn[disabled]{opacity:.6;cursor:wait}
.note{font-size:13px;color:var(--muted);margin:0}.err{color:var(--chili);font-size:14px;font-weight:600;min-height:1.3em;margin:0}
.badge{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
</style>
</head>
<body>
<header><a class="logo" href="/"><img class="m-l" src="/logo.png" alt=""><img class="m-d" src="/logo-claro.png" alt=""><span>Cosecha<em>Selecta</em></span></a></header>
<main>
<div class="card" id="box">
<h1 id="t">Revisando tu pago…</h1>
<p class="lead" id="m" style="margin:0"></p>
<a class="btn" id="b" href="/">Volver a CosechaSelecta</a>
</div>
</main>
<script>
const qs=new URLSearchParams(location.search), e=qs.get('estado'), p=qs.get('pedido');
const ped=p?` del pedido ${p.replace(/[^A-Za-z0-9-]/g,'')}`:'';
const M={
 pagado:['¡Pago <em>recibido</em>!',`Recibimos el pago${ped}. Te llegará el comprobante por correo y reservamos tu cosecha.`],
 pendiente:['Pago <em>pendiente</em>',`El pago${ped} aún no se confirma. Si pagaste por transferencia puede tardar unos minutos; te avisaremos por correo.`],
 rechazado:['El pago no se <em>completó</em>',`El pago${ped} fue rechazado. No se hizo ningún cargo. Puedes intentarlo de nuevo.`],
 anulado:['Pago <em>anulado</em>',`El pago${ped} se anuló. No se hizo ningún cargo.`],
 reservado:['Pedido <em>reservado</em>',`Reservamos tu pedido${p?' '+p.replace(/[^A-Za-z0-9-]/g,''):''}. Pagas contra entrega, con transferencia o efectivo. Te escribiremos para confirmar el día de entrega.`]
};
if(e==='pagado'||e==='reservado'){try{localStorage.removeItem('cs_carrito')}catch(x){}}
const [t,m]=M[e]||M.pendiente;
document.getElementById('t').innerHTML=t;document.getElementById('m').textContent=m;
if(e==='rechazado'||e==='anulado'){const b=document.getElementById('b');b.textContent='Intentar de nuevo';let hay=false;try{hay=JSON.parse(localStorage.getItem('cs_carrito')||'[]').length>0}catch(x){}b.href=hay?'/checkout.html':'/pagar.html'+(p?'?pedido='+encodeURIComponent(p):'');}
</script>
</body>
</html>
